name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, closed, assigned, labeled, ready_for_review]
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --frozen

    - name: Run deterministic tests
      run: |
        uv run --with pytest --with pytest-cov pytest -m "not live" --cov=src/pysft --cov-report=term-missing

    - name: Verify clean repository
      run: |
        git diff --exit-code
        test -z "$(git status --porcelain)"
