[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysft"
version = "1.2.0"
description = "Fetch security data and analyze with an LLM agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lucio" }]
license = { text = "Proprietary" }
dependencies = ["psutil>=7.2.1,<8",
                "scrapy>=2.14.1,<3",
                "numpy>=2.4.1,<3", 
                "pandas>=2.3.3,<3", 
                "yfinance>=1.0,<2",
                "exchange_calendars>=4.12,<5"]

# [Replit Agent] Declare version-bounded test tools separately from runtime dependencies.
[dependency-groups]
test = [
    "pytest>=8.4.2,<9",
    "pytest-cov>=7,<8",
]
typing = [
    "mypy>=2.4,<3",
    "pandas-stubs>=2.3.3,<2.4",
    "types-psutil>=7,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pysft*"]

[tool.setuptools.package-data]
pysft = ["fetch_preview.html"]

[project.urls]
Homepage = "https://github.com/LuciosProjects/PySFT"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["old_code", "prototyping", "tests/Flutter_App"]
markers = [
    "unit: focused tests for one module or component",
    "e2e: deterministic end-to-end tests using controlled provider scenarios",
    "live: opt-in tests that contact external providers",
]

[tool.mypy]
files = ["src"]
show_error_codes = true
warn_unused_ignores = true

# These external libraries ship no typing metadata. googletrans is optional;
# keep its existing runtime import/fallback behavior unchanged.
[[tool.mypy.overrides]]
module = [
    "yfinance", "yfinance.*",
    "exchange_calendars", "exchange_calendars.*",
    "googletrans", "googletrans.*",
]
ignore_missing_imports = true
